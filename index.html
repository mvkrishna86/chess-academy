<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chess Academy</title>
<link rel="stylesheet" href="css/style.css?v=11" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>♟️ Chess Academy</h1>
      <div class="header-actions">
        <span id="overallProgress" class="overall-progress"></span>
        <span id="authArea" class="auth-area">
          <button id="signInBtn" class="link-btn">Sign in with Google</button>
          <span id="userInfo" class="user-info" hidden>
            <span id="userEmail" class="user-email"></span>
            <button id="signOutBtn" class="link-btn">Sign out</button>
          </span>
        </span>
        <button id="resetProgressBtn" class="link-btn" title="Clear all saved progress">Reset progress</button>
      </div>
    </header>

    <nav class="mode-tabs" aria-label="App mode">
      <button id="puzzlesTabBtn" class="mode-tab active">📚 Puzzles</button>
      <button id="playTabBtn" class="mode-tab">🤖 Play vs Computer</button>
    </nav>

    <div class="app-body" id="puzzleMode">
      <nav class="sidebar" id="sidebar" aria-label="Lesson stages"></nav>

      <main class="main-panel">
        <section class="lesson-box">
          <h2 id="stageTitle"></h2>
          <p id="stageLesson"></p>
        </section>

        <section class="puzzle-area">
          <div class="puzzle-header">
            <span id="puzzleCounter"></span>
            <span class="jump-to-puzzle">
              Jump to #
              <input type="number" id="jumpInput" min="1" aria-label="Jump to puzzle number" />
              <button id="jumpBtn" class="secondary-btn">Go</button>
            </span>
            <button id="printStageBtn" class="secondary-btn">🖨️ Print this stage</button>
          </div>

          <div class="board-and-controls">
            <div id="boardContainer" class="board-container"></div>

            <div class="controls">
              <p id="turnHint" class="turn-hint">Your move — you're playing White!</p>
              <div id="message" class="message" role="status" aria-live="polite"></div>

              <div class="button-row">
                <button id="hintBtn" class="secondary-btn">💡 Hint</button>
                <button id="solutionBtn" class="secondary-btn">👀 Show Answer</button>
                <button id="retryBtn" class="secondary-btn">↩️ Reset Puzzle</button>
              </div>
              <div class="button-row">
                <button id="prevBtn" class="secondary-btn">⬅ Previous</button>
                <button id="nextBtn" class="primary-btn" disabled>Next Puzzle ➡</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="app-body" id="playMode" hidden>
      <main class="main-panel play-main-panel">
        <section class="lesson-box">
          <h2>🤖 Play vs Computer</h2>
          <p>You're always White. Pick a difficulty and play a full game against the engine — a real way to practice spotting the tactics you've been drilling.</p>
        </section>

        <section class="puzzle-area">
          <div class="puzzle-header">
            <label class="difficulty-picker">
              Difficulty:
              <select id="difficultySelect">
                <option value="0">Beginner</option>
                <option value="1">Easy</option>
                <option value="2" selected>Medium</option>
                <option value="3">Hard</option>
                <option value="4">Club</option>
              </select>
            </label>
            <button id="newGameBtn" class="primary-btn">New Game</button>
            <button id="resignBtn" class="secondary-btn">Resign</button>
          </div>

          <div class="board-and-controls">
            <div id="playBoardContainer" class="board-container"></div>

            <div class="controls">
              <p id="playStatus" class="turn-hint">Your move — you're playing White!</p>
              <div id="playMessage" class="message" role="status" aria-live="polite"></div>
              <div class="move-list-wrap">
                <h3>Moves</h3>
                <ol id="moveList" class="move-list"></ol>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Printable worksheet, hidden on screen, shown only via @media print -->
  <div id="printSheet" class="print-sheet"></div>

  <script src="js/vendor/chess.js?v=11"></script>
  <script src="js/curriculum.js?v=11"></script>
  <script src="js/board.js?v=11"></script>
  <script src="js/print.js?v=11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js?v=11"></script>
  <script src="js/auth.js?v=11"></script>
  <script src="js/app.js?v=11"></script>
  <script src="js/engine.js?v=11"></script>
  <script src="js/play.js?v=11"></script>
  <script src="js/mode-switch.js?v=11"></script>
</body>
</html>
